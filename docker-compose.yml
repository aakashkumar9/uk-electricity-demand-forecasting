services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - EDF_API_URL=http://api:8000
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - api
    restart: unless-stopped

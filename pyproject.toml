[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edf"
version = "1.0.0"
description = "UK energy demand forecasting: NESO + weather data, seasonal-naive/LightGBM/LSTM models, rolling-origin backtesting, FastAPI serving, Streamlit dashboard."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
